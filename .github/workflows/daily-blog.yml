name: Daily Tech Briefing

on:
  schedule:
    # 05:00 UTC daily (~08:00 Nairobi time). Cron always runs in UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the built-in GITHUB_TOKEN can push the commit

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today's briefing
        run: node scripts/generate-daily-blog.mjs

      - name: Commit and push if there were changes
        run: |
          git config user.name "CloudGrid Africa Bot"
          git config user.email "bot@cloudgridafrica.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No new stories today — nothing to commit."
          else
            git commit -m "Daily Tech Briefing: $(date -u +%Y-%m-%d)"
            git push
          fi
